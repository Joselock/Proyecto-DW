<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagina de Presentacion</title>
    <link rel="stylesheet" href="./css/inicio.css" />
  </head>
  <body>
    <div class="container" id="container">
      <!-- Panel principal (izquierda) -->
      <div class="panel-izquierdo">
        <h1 class="titulo">Sistema de Gestion Hospitalaria</h1>
        <h3 class="subtitulo">
          Sistema de control y consulta del hospital al que perteneces.
        </h3>
        <div class="buttons">
          <button type="button" class="button" id="btnLogin">Sign In</button>
          <button type="button" class="button" id="btnRegister">
            Register
          </button>
        </div>
      </div>

      <!-- Panel de imagen (derecha) -->
      <div class="panel-derecho">
        <img src="./assets/img/login.jpg" alt="Imagen" />
      </div>

      <!-- Formulario de inicio de sesión (hermano, NO anidado) -->
      <div class="form-container form-login">
        <button type="button" class="volver" id="backFromLogin">
          ← Volver
        </button>
        <h1>Sign In</h1>
        <div class="entradas">
          <h4>Profile Name</h4>
          <input type="text" />
          <h4>Password</h4>
          <input type="password" />
          <button type="button" class="boton-Inicio">Entrar</button>
          <p><a href="#">¿Forgot password?</a></p>
        </div>
      </div>

      <!-- Formulario de registro (hermano) -->
      <div class="form-container form-register">
        <button type="button" class="volver" id="backFromRegister">
          ← Volver
        </button>
        <h1>Register</h1>
        <div class="entradas">
          <h4>Nombre completo</h4>
          <input type="text" />
          <h4>Correo electrónico</h4>
          <input type="email" />
          <h4>Password</h4>
          <input type="password" />
          <button type="button" class="boton-Inicio">Registrarse</button>
        </div>
      </div>
    </div>

    <!-- SOLO cargamos el JS de autenticación en esta página -->
    <script src="./js/auth.js"></script>
  </body>
</html>
